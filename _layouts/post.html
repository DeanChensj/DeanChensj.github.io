---
layout: default
---
<article class="prose-card" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="prose-header">
    <a class="back-link" href="{{ site.baseurl }}/#writing">← Back to All Posts</a>
    <h1 class="prose-title" itemprop="name headline">{{ page.title }}</h1>
    <div class="prose-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.categories and page.categories.size > 0 %}
        <span class="meta-sep">·</span>
        <span class="post-tag">{{ page.categories | join: " / " }}</span>
      {% endif %}
    </div>
  </header>

  <div class="prose-body" itemprop="articleBody">
    {{ content }}
  </div>
</article>
