<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>

    {% include header.html %}

    <main class="main-content">
      <div class="container">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}

    <!-- Fullscreen Image Lightbox Modal -->
    <div id="image-lightbox" class="lightbox-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="lightbox-dialog">
        <div class="lightbox-bar">
          <span id="lightbox-caption" class="lightbox-title"></span>
          <div class="lightbox-actions">
            <a id="lightbox-app-link" class="btn btn-card-primary" href="#" target="_blank" rel="noopener">Open Live App ↗</a>
            <button type="button" id="lightbox-close" class="lightbox-close-btn" aria-label="Close preview">ESC</button>
          </div>
        </div>
        <div class="lightbox-img-wrap">
          <img id="lightbox-img" src="" alt="Expanded preview">
        </div>
      </div>
    </div>

    <script>
    (function() {
      var modal = document.getElementById('image-lightbox');
      var modalImg = document.getElementById('lightbox-img');
      var modalTitle = document.getElementById('lightbox-caption');
      var modalLink = document.getElementById('lightbox-app-link');
      var closeBtn = document.getElementById('lightbox-close');
      if (!modal) return;

      function openLightbox(src, title, link) {
        modalImg.src = src;
        modalTitle.textContent = title || '';
        if (link) {
          modalLink.href = link;
          modalLink.style.display = 'inline-flex';
        } else {
          modalLink.style.display = 'none';
        }
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      document.querySelectorAll('[data-lightbox-src]').forEach(function(el) {
        el.addEventListener('click', function() {
          openLightbox(
            el.getAttribute('data-lightbox-src'),
            el.getAttribute('data-lightbox-title'),
            el.getAttribute('data-lightbox-link')
          );
        });
      });

      closeBtn.addEventListener('click', closeLightbox);
      modal.addEventListener('click', function(e) {
        if (e.target === modal || e.target.classList.contains('lightbox-img-wrap')) {
          closeLightbox();
        }
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.classList.contains('is-open')) {
          closeLightbox();
        }
      });

      // Live GitHub Star count sync (5-min TTL + Shields.io fallback for rate-limited corp IPs)
      document.querySelectorAll('[data-gh-stars]').forEach(function(badge) {
        var repo = badge.getAttribute('data-gh-stars');
        if (!repo) return;
        var cacheKey = 'gh_stars_v2_' + repo;
        var ttlMs = 5 * 60 * 1000;
        var now = Date.now();
        try {
          sessionStorage.removeItem('gh_stars_' + repo);
          var raw = localStorage.getItem(cacheKey);
          if (raw) {
            var cached = JSON.parse(raw);
            if (cached && cached.count) {
              badge.textContent = cached.count + ' Stars';
              if (cached.ts && (now - cached.ts < ttlMs)) return;
            }
          }
        } catch (e) {}

        function applyCount(countStr) {
          badge.textContent = countStr + ' Stars';
          try {
            localStorage.setItem(cacheKey, JSON.stringify({ count: countStr, ts: Date.now() }));
          } catch (e) {}
        }

        fetch('https://api.github.com/repos/' + repo)
          .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function(data) {
            if (data && typeof data.stargazers_count === 'number') {
              applyCount(data.stargazers_count.toLocaleString());
            }
          })
          .catch(function() {
            fetch('https://img.shields.io/github/stars/' + repo + '.json')
              .then(function(r) { return r.ok ? r.json() : null; })
              .then(function(data) {
                if (data && data.value) {
                  applyCount(String(data.value));
                }
              })
              .catch(function() {});
          });
      });
    })();
    </script>

  </body>

</html>
